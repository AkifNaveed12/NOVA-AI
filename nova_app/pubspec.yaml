name: nova_app
description: NOVA AI - Android companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & WebSocket
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # Local storage (IP, API key, setup state)
  shared_preferences: ^2.2.2

  # Markdown rendering for coding assistant
  flutter_markdown: ^0.7.3

  # Voice input
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.6
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
